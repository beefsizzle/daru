# greetd's config for daru's login screen, put in /etc/greetd/config.toml by greetd/install.sh

[terminal]
vt = 1

# cage shows one program over the whole screen and quits when it does. -s keeps ctrl+alt+F2 and the other text
# logins working. with more than one monitor it stretches the greeter across them all, so daru-greeter lays them over
# one another and each shows the whole login screen
[default_session]
command = "cage -s -- /etc/greetd/daru-greeter"
user = "greeter"
